name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^7.0.0
  intl: ^0.20.3
  shared_preferences: ^2.2.3
  image_picker: ^1.1.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  camera: ^0.11.0+2
  path_provider: ^2.1.1
  uuid: ^4.2.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  connectivity_plus: ^6.0.0
  workmanager: ^0.6.0
  fl_chart: ^1.2.0
  fvm: ^2.4.1
  device_info_plus: ^12.4.0
  http_parser: ^4.0.2
  google_mlkit_face_detection: ^0.15.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.1
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

dependency_overrides:
  shared_preferences_android: ^2.2.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/bsplogo.png

# On-device face detection & head-pose estimation use Google ML Kit
# (google_mlkit_face_detection), which ships its native model via Google
# Play Services (Android) / CocoaPods (iOS) and therefore needs no CMake
# native-asset build. The OpenCV `face` module (YuNet/SFace) is NOT available
# with dartcv4 (BUILD_opencv_face is forced OFF), so all embedding/recognition
# work is delegated to the backend `/face/*` endpoints (face-service).

